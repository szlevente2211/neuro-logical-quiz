<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz Exam Practice Tool</title>
  <style>
    /* ========== SZÍNPALETTA ==========
       Ha megvan a neurological.hu pontos színkódja, elég ITT átírni
       a változókat, a többi design automatikusan követi. */
    :root {
      --brand-900: #000000;      /* legsötétebb kék (fejléc, szöveg) */
      --brand-700: #c9971f;      /* sötétkék (gombok hover) */
      --brand-600: #183353;      /* fő márkakék */
      --brand-500: #2a6fd1;      /* világosabb kiemelő kék */
      --brand-100: #e4edf9;      /* halvány kék felület */
      --bg: #364c67;            /* oldal háttér */
      --surface: #ffffff;        /* kártya háttér */
      --text: #14243b;           /* fő szöveg */
      --muted: #5b6b82;          /* halvány szöveg */
      --border: #d3deee;         /* szegélyek */
      --shadow: 0 6px 24px rgba(10, 31, 61, 0.08);
      --radius: 12px;
    }

    /* ========== BASIC STYLES ========== */
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      margin: 0; padding: 0;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      transition: background-color 0.3s, color 0.3s;
    }
    header, .quiz-container, footer {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 10px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 24px;
    }
    header h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: var(--brand-900);
      padding-left: 12px;
      border-left: 4px solid var(--brand-500);
    }
    button {
      cursor: pointer;
      padding: 9px 18px;
      margin: 6px 0;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background-color: var(--brand-600);
      border: 1px solid var(--brand-600);
      border-radius: 8px;
      transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
    }
    button:hover {
      background-color: var(--brand-700);
      border-color: var(--brand-700);
    }
    button:active {
      transform: translateY(1px);
    }
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(42, 111, 209, 0.45);
      outline-offset: 2px;
    }
    #theme-toggle {
      background-color: transparent;
      color: var(--brand-600);
      border: 1px solid var(--brand-600);
      font-size: 0.85rem;
      white-space: nowrap;
    }
    #theme-toggle:hover {
      background-color: var(--brand-100);
      border-color: var(--brand-600);
    }
    .question {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--brand-900);
      margin-top: 20px;
    }
    .question pre, .option-item pre {
      background-color: var(--brand-100);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      overflow-x: auto;
      font-weight: 400;
    }
    .options {
      margin: 14px 0;
    }
    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 8px 0;
      padding: 10px 14px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .option-item:hover {
      border-color: var(--brand-500);
      background-color: var(--brand-100);
    }
    .option-item:has(input:checked) {
      border-color: var(--brand-600);
      background-color: var(--brand-100);
    }
    .option-item input {
      margin-top: 4px;
      accent-color: var(--brand-600);
      flex-shrink: 0;
    }
    .option-item label {
      cursor: pointer;
      flex: 1;
    }
    .feedback {
      text-align: center;
      font-weight: 600;
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }
    /* feedback color states */
    .feedback.correct {
      background-color: #d7f0df; /* Light green */
      color: #14532d;
      border: 1px solid #9fd8b2;
    }
    .feedback.incorrect {
      background-color: #fde0e0; /* Light red */
      color: #7f1d1d;
      border: 1px solid #f1a8a8;
    }
    .feedback.partial {
      background-color: #fff3cd; /* Light yellow */
      color: #6b4e00;
      border: 1px solid #f0d78a;
    }
    #next-btn, #check-btn {
      margin-right: 10px;
    }
    .hidden {
      display: none;
    }

    /* ========== THEME STYLES ========== */
    .dark-mode {
      --bg: #071428;
      --surface: #0e2240;
      --text: #e6edf8;
      --muted: #93a4be;
      --border: #1f3a63;
      --brand-100: #12294a;
      --brand-900: #e6edf8;
      --brand-600: #3b82e6;
      --brand-700: #5b9af0;
      --brand-500: #5b9af0;
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
      background-color: var(--bg);
      color: var(--text);
    }
    .dark-mode button {
      color: #04101f;
    }
    .dark-mode #theme-toggle {
      color: var(--brand-600);
    }
    .dark-mode .feedback.correct {
      background-color: #1f6b3a;
      color: #fff;
      border-color: #2e8b50;
    }
    .dark-mode .feedback.incorrect {
      background-color: #b32626;
      color: #fff;
      border-color: #d24848;
    }
    .dark-mode .feedback.partial {
      background-color: #e6b422;
      color: #000;
      border-color: #f0c840;
    }

    /* ========== LAYOUT MIMIC ========== */
    .quiz-layout {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-top: 5px solid var(--brand-600);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-top: 20px;
      padding: 24px;
    }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.9rem;
    }
    .timer {
      font-weight: 700;
      color: var(--brand-600);
      background-color: var(--brand-100);
      padding: 4px 12px;
      border-radius: 999px;
    }
    #questions-remaining {
      font-weight: 700;
      color: var(--brand-600);
    }
    .navigation-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
    }
    .score-container {
      text-align: center;
      margin: 20px 0;
      padding: 32px 20px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-top: 5px solid var(--brand-600);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .score-container h2 {
      margin: 0 0 8px;
      color: var(--brand-900);
    }
    #score-percent {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--brand-600);
    }
    footer {
      color: var(--muted);
      font-size: 0.8rem;
    }
    footer p {
      color: var(--muted);
    }
  </style>
</head>
<body>
  
  <div class="quiz-container">
    <!-- The container for everything quiz-related -->
    <div class="quiz-layout" id="quiz-layout">
      <div class="top-row">
        <div class="timer" id="timer">00:00</div>
        <div>Hátralevő kérdések: <span id="questions-remaining"></span></div>
      </div>

      <div id="question-container">
        <div class="question" id="question-text"></div>
        <div class="options" id="options-container"></div>
        <div class="feedback" id="feedback"></div>
      </div>

      <div class="navigation-row">
        <button id="check-btn">Ellenőrzés</button>
        <button id="next-btn" class="hidden">Next Question</button>
      </div>
    </div>

    <div class="score-container hidden" id="score-container">
      <h2>Your final score:</h2>
      <div id="score-percent"></div>
    </div>
  </div>

  <script>
    /******************************************************
     * 1) CONFIGURATION & QUESTION DATA (inlined)
     ******************************************************/
    const config = {
      // total time in seconds
      totalTime: 600,
      // how many questions to pick
      questionsToPick: 10
    };

    let questionPool = [];

  /******************************************************
   * 2) GLOBAL STATE
   ******************************************************/
   let selectedQuestions = [];
  let currentIndex = 0;
  let userScore = 0; // partial scores for multiple-choice
  let timerInterval = null;
  let timeRemaining = 0;

  /******************************************************
   * 3) DOM ELEMENTS
   ******************************************************/
  const timerEl              = document.getElementById('timer');
  const questionTextEl       = document.getElementById('question-text');
  const optionsContainerEl   = document.getElementById('options-container');
  const feedbackEl           = document.getElementById('feedback');
  const nextBtn              = document.getElementById('next-btn');
  const checkBtn             = document.getElementById('check-btn');
  const themeToggleBtn       = document.getElementById('theme-toggle');
  const scoreContainerEl     = document.getElementById('score-container');
  const scorePercentEl       = document.getElementById('score-percent');
  const questionsRemainingEl = document.getElementById('questions-remaining');

  /******************************************************
   * 4) INIT QUIZ
   ******************************************************/
  window.addEventListener('DOMContentLoaded', async () => {
  try {
    const response = await fetch('questions.json');

    if (!response.ok) {
      throw new Error('Could not load questions.json');
    }

    questionPool = await response.json();

    initQuiz();
  } catch (error) {
    console.error(error);
    questionTextEl.textContent = 'A kérdésbank betöltése sikertelen.';
  }
});

  function initQuiz() {
    // Shuffle and pick N questions
    const shuffled = questionPool.sort(() => Math.random() - 0.5);
    selectedQuestions = shuffled.slice(0, config.questionsToPick);

    // Reset state
    currentIndex = 0;
    userScore = 0;
    timeRemaining = config.totalTime;
    feedbackEl.style.display = 'none';
    nextBtn.classList.add('hidden');
    checkBtn.classList.remove('hidden');
    scoreContainerEl.classList.add('hidden');
    document.getElementById('quiz-layout').style.display = 'block';

    // Start timer
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);

    // Render first question
    renderQuestion();
  }

  /******************************************************
   * 5) HELPER: FORMAT TEXT FOR HTML
   ******************************************************/
  function formatTextForHTML(str) {
    // 1) Escape < and > so they're shown as text
    let safe = str
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    // 2) Replace code blocks: ``` some code ```
    safe = safe.replace(/```([^`]+)```/g, '<pre><code>$1</code></pre>');

    // 3) Convert newlines to <br/>
    safe = safe.replace(/\n/g, '<br/>');

    return safe;
  }

  /******************************************************
   * 6) RENDER QUESTION
   ******************************************************/
  function renderQuestion() {
    const q = selectedQuestions[currentIndex];

    // Use formatTextForHTML for the question
    questionTextEl.innerHTML = formatTextForHTML(q.question);

    optionsContainerEl.innerHTML = '';
    feedbackEl.textContent = '';
    feedbackEl.style.display = 'none';
    feedbackEl.className = 'feedback'; // reset classes

    // Single-choice => radio, multiple => checkbox
    const inputType = (q.type === 'single') ? 'radio' : 'checkbox';

    // === RANDOMIZE ANSWERS BY SHUFFLING THE OPTIONS ===
    const shuffledOptions = q.options
      .map((optionText, originalIndex) => ({ 
        text: optionText, 
        index: originalIndex 
      }))
      .sort(() => Math.random() - 0.5);

    // Now loop over the shuffled list to build UI
    shuffledOptions.forEach(({ text, index }) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'option-item';

      const input = document.createElement('input');
      input.type = inputType;
      input.name = 'quizOption_' + currentIndex; // group name
      // IMPORTANT: set the value to the *original* index
      input.value = index; 

      // Use the same function for options so code blocks appear properly
      const label = document.createElement('label');
      label.innerHTML = formatTextForHTML(text);

      wrapper.appendChild(input);
      wrapper.appendChild(label);
      optionsContainerEl.appendChild(wrapper);
    });

    // Update "questions remaining"
    questionsRemainingEl.textContent = (selectedQuestions.length - currentIndex);
  }

  /******************************************************
   * 7) CHECK ANSWER
   ******************************************************/
  checkBtn.addEventListener('click', () => {
    const q = selectedQuestions[currentIndex];
    const inputs = [...optionsContainerEl.querySelectorAll('input')];
    
    // Indices that the user checked
    const checkedIndices = inputs
      .filter(inp => inp.checked)
      .map(inp => parseInt(inp.value));

    // Evaluate correctness
    const correctSet = new Set(q.correctAnswers);
    const userSet = new Set(checkedIndices);

    // If user selected any *incorrect* => 0
    let fraction = 0;
    for (let val of userSet) {
      if (!correctSet.has(val)) {
        fraction = 0;
        showFeedback('incorrect', q, fraction);
        userScore += 0;
        return;
      }
    }

    // If user didn't pick anything wrong but missed some correct => partial
    fraction = userSet.size / correctSet.size;
    if (fraction === 1) {
      showFeedback('correct', q, fraction);
    } else if (fraction > 0) {
      showFeedback('partial', q, fraction);
    } else {
      showFeedback('incorrect', q, fraction);
    }
    userScore += fraction;
  });

  /******************************************************
   * 8) SHOW FEEDBACK
   ******************************************************/
  function showFeedback(status, question, fraction) {
    feedbackEl.style.display = 'block';

    // For the "correct answers" portion, we might just show them as text:
    const escapeHTML = (str) =>
      str.replace(/</g, '&lt;').replace(/>/g, '&gt;');

    // Build correct answer string
    const correctAnswersText = question.correctAnswers
      .map(idx => escapeHTML(question.options[idx]))
      .join(', ');

    if (status === 'correct') {
      feedbackEl.classList.add('correct');
      feedbackEl.innerHTML = 'Correct!';
    } else if (status === 'partial') {
      feedbackEl.classList.add('partial');
      const percent = (fraction * 100).toFixed(0);
      feedbackEl.innerHTML = `Partially correct (${percent}%).<br/>
        Correct answers: ${correctAnswersText}`;
    } else {
      feedbackEl.classList.add('incorrect');
      feedbackEl.innerHTML = `Incorrect!<br/>
        Correct answers: ${correctAnswersText}`;
    }

    // Hide check button, show next
    checkBtn.classList.add('hidden');
    nextBtn.classList.remove('hidden');
  }

  /******************************************************
   * 9) NEXT QUESTION
   ******************************************************/
  nextBtn.addEventListener('click', () => {
    currentIndex++;
    if (currentIndex >= selectedQuestions.length) {
      endQuiz();
      return;
    }
    nextBtn.classList.add('hidden');
    checkBtn.classList.remove('hidden');
    renderQuestion();
  });

  /******************************************************
   * 10) END QUIZ
   ******************************************************/
  function endQuiz() {
    clearInterval(timerInterval);
    timerInterval = null;
    document.getElementById('quiz-layout').style.display = 'none';

    // Convert userScore to a final percentage
    const finalScore = (userScore / selectedQuestions.length) * 100;
    scorePercentEl.textContent = finalScore.toFixed(2) + '%';
    scoreContainerEl.classList.remove('hidden');
  }

  /******************************************************
   * 11) TIMER
   ******************************************************/
  function updateTimer() {
    if (timeRemaining <= 0) {
      endQuiz();
      return;
    }
    timeRemaining--;
    let minutes = Math.floor(timeRemaining / 60);
    let seconds = timeRemaining % 60;
    if (seconds < 10) seconds = '0' + seconds;
    timerEl.textContent = `${minutes}:${seconds}`;
  }

  /******************************************************
   * 12) THEME TOGGLE
   ******************************************************/
  themeToggleBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
  });

  </script>
  
</body>
</html>
