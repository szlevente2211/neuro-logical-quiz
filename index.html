<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz Exam Practice Tool</title>
  <style>
    /* ========== SZÍNPALETTA ==========
       Ha megvan a neurological.hu pontos színkódja, elég ITT átírni
       a változókat, a többi design automatikusan követi. */
    :root {
      --brand-900: #000000;      /* legsötétebb kék (fejléc, szöveg) */
      --brand-700: #c9971f;      /* sötétkék (gombok hover) */
      --brand-600: #183353;      /* fő márkakék */
      --brand-500: #364c67;      /* világosabb kiemelő kék */
      --brand-100: #e4edf9;      /* halvány kék felület */
      --bg: #364c67;            /* oldal háttér */
      --surface: #ffffff;        /* kártya háttér */
      --text: #14243b;           /* fő szöveg */
      --muted: #5b6b82;          /* halvány szöveg */
      --border: #d3deee;         /* szegélyek */
      --shadow: 0 6px 24px rgba(10, 31, 61, 0.08);
      --radius: 12px;

      /* --- A kérdés feletti kiemelő fejléc külön színei --- */
      --header-stripe: #c9971f;      /* a kártya tetején lévő vastag csík */
      --header-bg: transparent;      /* a fejléc sor háttere */
      --header-text: #5b6b82;        /* "Hátralevő kérdések:" szöveg */
      --header-count: #183353;       /* a hátralevő kérdések száma */
      --header-line: #d3deee;        /* a fejléc alatti vékony vonal */
      --header-timer-bg: #e4edf9;    /* az időzítő "pirula" háttere */
      --header-timer-text: #183353;  /* az időzítő szövege */
    }

    /* ========== BASIC STYLES ========== */
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      margin: 0; padding: 0;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      transition: background-color 0.3s, color 0.3s;
    }
    header, .quiz-container, footer {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 10px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 24px;
    }
    header h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: var(--brand-900);
      padding-left: 12px;
      border-left: 4px solid var(--brand-500);
    }
    button {
      cursor: pointer;
      padding: 9px 18px;
      margin: 6px 0;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background-color: var(--brand-600);
      border: 1px solid var(--brand-600);
      border-radius: 8px;
      transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
    }
    button:hover {
      background-color: var(--brand-700);
      border-color: var(--brand-700);
    }
    button:active {
      transform: translateY(1px);
    }
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(42, 111, 209, 0.45);
      outline-offset: 2px;
    }
    #theme-toggle {
      background-color: transparent;
      color: var(--brand-600);
      border: 1px solid var(--brand-600);
      font-size: 0.85rem;
      white-space: nowrap;
    }
    #theme-toggle:hover {
      background-color: var(--brand-100);
      border-color: var(--brand-600);
    }
    .question {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--brand-900);
      margin-top: 20px;
    }
    .question pre, .option-item pre {
      background-color: var(--brand-100);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      overflow-x: auto;
      font-weight: 400;
    }
    .options {
      margin: 14px 0 0;
    }
    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 8px 0;
      padding: 10px 14px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .option-item:hover {
      border-color: var(--brand-500);
      background-color: var(--brand-100);
    }
    .option-item:has(input:checked) {
      border-color: var(--brand-600);
      background-color: var(--brand-100);
    }
    .option-item input {
      margin-top: 4px;
      accent-color: var(--brand-600);
      flex-shrink: 0;
      cursor: pointer;
    }
    .option-item label {
      cursor: pointer;
      flex: 1;
    }
    .feedback {
      text-align: center;
      font-weight: 600;
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }
    /* feedback color states */
    .feedback.correct {
      background-color: #d7f0df; /* Light green */
      color: #14532d;
      border: 1px solid #9fd8b2;
    }
    .feedback.incorrect {
      background-color: #fde0e0; /* Light red */
      color: #7f1d1d;
      border: 1px solid #f1a8a8;
    }
    .feedback.partial {
      background-color: #fff3cd; /* Light yellow */
      color: #6b4e00;
      border: 1px solid #f0d78a;
    }
    #next-btn, #check-btn {
      margin-right: 10px;
    }
    .hidden {
      display: none;
    }

    /* ========== THEME STYLES ========== */
    .dark-mode {
      --bg: #071428;
      --surface: #0e2240;
      --text: #e6edf8;
      --muted: #93a4be;
      --border: #1f3a63;
      --brand-100: #12294a;
      --brand-900: #e6edf8;
      --brand-600: #3b82e6;
      --brand-700: #5b9af0;
      --brand-500: #5b9af0;
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.4);

      /* kiemelő fejléc sötét módban */
      --header-stripe: #3b82e6;
      --header-bg: transparent;
      --header-text: #93a4be;
      --header-count: #3b82e6;
      --header-line: #1f3a63;
      --header-timer-bg: #12294a;
      --header-timer-text: #3b82e6;

      background-color: var(--bg);
      color: var(--text);
    }
    .dark-mode button {
      color: #04101f;
    }
    .dark-mode #theme-toggle {
      color: var(--brand-600);
    }
    .dark-mode .feedback.correct {
      background-color: #1f6b3a;
      color: #fff;
      border-color: #2e8b50;
    }
    .dark-mode .feedback.incorrect {
      background-color: #b32626;
      color: #fff;
      border-color: #d24848;
    }
    .dark-mode .feedback.partial {
      background-color: #e6b422;
      color: #000;
      border-color: #f0c840;
    }

    /* ========== LAYOUT MIMIC ========== */
    .quiz-container {
      padding-bottom: 32px; /* hely az árnyéknak, hogy az iframe ne vágja le */
    }
    .quiz-layout {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-top: 5px solid var(--header-stripe);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin: 20px 0 0;
      padding: 24px 24px 16px;
    }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--header-line);
      background-color: var(--header-bg);
      color: var(--header-text);
      font-size: 0.9rem;
    }
    .timer {
      font-weight: 700;
      color: var(--header-timer-text);
      background-color: var(--header-timer-bg);
      padding: 4px 12px;
      border-radius: 999px;
    }
    #questions-remaining {
      font-weight: 700;
      color: var(--header-count);
    }
    .navigation-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }
    .navigation-row button {
      margin-bottom: 0;
    }
    .score-container {
      text-align: center;
      margin: 20px 0 0;
      padding: 32px 20px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-top: 5px solid var(--brand-600);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .score-container h2 {
      margin: 0 0 8px;
      color: var(--brand-900);
    }
    #score-percent {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--brand-600);
    }
    footer {
      color: var(--muted);
      font-size: 0.8rem;
    }
    footer p {
      color: var(--muted);
    }
  </style>
</head>
<body>
  
  <div class="quiz-container">
    <!-- The container for everything quiz-related -->
    <div class="quiz-layout" id="quiz-layout">
      <div class="top-row">
        <div class="timer" id="timer">00:00</div>
        <div>Hátralevő kérdések: <span id="questions-remaining"></span></div>
      </div>

      <div id="question-container">
        <div class="question" id="question-text"></div>
        <div class="options" id="options-container"></div>
        <div class="feedback" id="feedback"></div>
      </div>

      <div class="navigation-row">
        <button id="check-btn">Ellenőrzés</button>
        <button id="next-btn" class="hidden">Next Question</button>
      </div>
    </div>

    <div class="score-container hidden" id="score-container">
      <h2>Your final score:</h2>
      <div id="score-percent"></div>
    </div>
  </div>

  <script>
    /******************************************************
     * 1) CONFIGURATION & QUESTION DATA (inlined)
     ******************************************************/
    const config = {
      // total time in seconds
      totalTime: 900,
      // how many questions to pick
      questionsToPick: 10
    };

    let questionPool = [];

  /******************************************************
   * 2) GLOBAL STATE
   ******************************************************/
   let selectedQuestions = [];
  let currentIndex = 0;
  let userScore = 0; // partial scores for multiple-choice
  let timerInterval = null;
  let timeRemaining = 0;

  // --- Folytatás frissítés után ---
  let originalPool = [];          // a kérdések az eredeti sorrendben
  let scoreAtQuestionStart = 0;   // a pontszám az aktuális kérdés kezdetekor
  const STORAGE_KEY = 'neurokviz_progress_v2';
  const NAME_PREFIX = 'neurokviz:';  // a window.name tartalék előtagja

  // A kérdések azonosítása a questions.json "id" mezője alapján
  // (ha egy kérdésnek nincs id-ja, a sorszámát használjuk)
  function qKey(q) {
    if (q && q.id !== undefined && q.id !== null) return String(q.id);
    return 'idx' + originalPool.indexOf(q);
  }
  function findByKey(key) {
    return originalPool.find(q => qKey(q) === String(key)) || null;
  }

  // Mentett adat olvasása a helyi tárolókból (localStorage → sessionStorage → window.name)
  function readLocalRaw() {
    let v = null;
    try { v = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    if (v) return v;
    try { v = sessionStorage.getItem(STORAGE_KEY); } catch (e) {}
    if (v) return v;
    try {
      const n = String(window.name || '');
      if (n.indexOf(NAME_PREFIX) === 0) return n.slice(NAME_PREFIX.length);
    } catch (e) {}
    return null;
  }

  // Üzenet küldése a beágyazó oldalnak (ha iframe-ben fut)
  function postToParent(msg) {
    try {
      if (window.parent !== window) window.parent.postMessage(msg, '*');
    } catch (e) {}
  }

  function saveProgress() {
    const json = JSON.stringify({
      selectedIds: selectedQuestions.map(qKey),     // a kisorsolt kérdések id-i, sorrendben
      currentId: qKey(selectedQuestions[currentIndex]), // melyik id-nál tartott
      currentIndex: currentIndex,
      score: scoreAtQuestionStart,
      timeRemaining: timeRemaining
    });
    // 1) a kvíz saját tárolójába (ha a böngésző engedi) – több helyre, tartalékként
    try { localStorage.setItem(STORAGE_KEY, json); } catch (e) {}
    try { sessionStorage.setItem(STORAGE_KEY, json); } catch (e) {}
    try { window.name = NAME_PREFIX + json; } catch (e) {}
    // 2) a beágyazó oldal tárolójába is (iframe-ben ez megbízhatóbb)
    postToParent({ type: 'quiz-save', state: json });
  }

  function clearProgress() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    try { sessionStorage.removeItem(STORAGE_KEY); } catch (e) {}
    try { if (String(window.name).indexOf(NAME_PREFIX) === 0) window.name = ''; } catch (e) {}
    postToParent({ type: 'quiz-clear' });
  }

  // Mentett állapot lekérése: először a beágyazó oldaltól, ha az nem válaszol, a saját tárolóból
  function getSavedRaw() {
    return new Promise(resolve => {
      const local = readLocalRaw();
      if (window.parent === window) { resolve(local); return; }

      let done = false;
      function finish(value) {
        if (done) return;
        done = true;
        window.removeEventListener('message', onMsg);
        resolve(value);
      }
      function onMsg(e) {
        if (e.source !== window.parent || !e.data || e.data.type !== 'quiz-state') return;
        finish(typeof e.data.state === 'string' ? e.data.state : local);
      }
      window.addEventListener('message', onMsg);
      postToParent({ type: 'quiz-load' });
      setTimeout(() => finish(local), 800);
    });
  }

  function loadProgress(raw) {
    try {
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || !Array.isArray(s.selectedIds)) return null;

      const expected = Math.min(config.questionsToPick, originalPool.length);
      if (s.selectedIds.length !== expected) return null;

      // az id-k alapján keressük vissza a kérdéseket a questions.json-ból
      const questions = s.selectedIds.map(findByKey);
      if (questions.some(q => !q)) return null; // valamelyik kérdés már nincs meg

      // hol tartott: elsősorban az id alapján
      let idx = s.selectedIds.map(String).indexOf(String(s.currentId));
      if (idx < 0) idx = s.currentIndex;
      if (!Number.isInteger(idx) || idx < 0 || idx >= questions.length) return null;

      if (typeof s.timeRemaining !== 'number' || s.timeRemaining <= 0) return null;
      if (typeof s.score !== 'number' || s.score < 0) return null;

      return { questions: questions, currentIndex: idx, score: s.score, timeRemaining: s.timeRemaining };
    } catch (e) {
      return null;
    }
  }

  /******************************************************
   * 3) DOM ELEMENTS
   ******************************************************/
  const timerEl              = document.getElementById('timer');
  const questionTextEl       = document.getElementById('question-text');
  const optionsContainerEl   = document.getElementById('options-container');
  const feedbackEl           = document.getElementById('feedback');
  const nextBtn              = document.getElementById('next-btn');
  const checkBtn             = document.getElementById('check-btn');
  const themeToggleBtn       = document.getElementById('theme-toggle');
  const scoreContainerEl     = document.getElementById('score-container');
  const scorePercentEl       = document.getElementById('score-percent');
  const questionsRemainingEl = document.getElementById('questions-remaining');

  /******************************************************
   * 4) INIT QUIZ
   ******************************************************/
  window.addEventListener('DOMContentLoaded', async () => {
  try {
    const response = await fetch('questions.json');

    if (!response.ok) {
      throw new Error('Could not load questions.json');
    }

    questionPool = await response.json();
    originalPool = questionPool.slice();

    initQuiz(loadProgress(await getSavedRaw()));
  } catch (error) {
    console.error(error);
    questionTextEl.textContent = 'A kérdésbank betöltése sikertelen.';
  }
});

  function initQuiz(saved) {
    if (saved) {
      // Folytatás ott, ahol abbahagyta
      selectedQuestions = saved.questions;
      currentIndex = saved.currentIndex;
      userScore = saved.score;
      timeRemaining = saved.timeRemaining;

      let m = Math.floor(timeRemaining / 60);
      let sec = timeRemaining % 60;
      if (sec < 10) sec = '0' + sec;
      timerEl.textContent = `${m}:${sec}`;
    } else {
      // Shuffle and pick N questions
      const shuffled = questionPool.sort(() => Math.random() - 0.5);
      selectedQuestions = shuffled.slice(0, config.questionsToPick);

      // Reset state
      currentIndex = 0;
      userScore = 0;
      timeRemaining = config.totalTime;
    }
    feedbackEl.style.display = 'none';
    nextBtn.classList.add('hidden');
    checkBtn.classList.remove('hidden');
    scoreContainerEl.classList.add('hidden');
    document.getElementById('quiz-layout').style.display = 'block';

    // Start timer
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);

    // Render first question
    renderQuestion();
  }

  /******************************************************
   * 5) HELPER: FORMAT TEXT FOR HTML
   ******************************************************/
  function formatTextForHTML(str) {
    // 1) Escape < and > so they're shown as text
    let safe = str
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    // 2) Replace code blocks: ``` some code ```
    safe = safe.replace(/```([^`]+)```/g, '<pre><code>$1</code></pre>');

    // 3) Convert newlines to <br/>
    safe = safe.replace(/\n/g, '<br/>');

    return safe;
  }

  /******************************************************
   * 6) RENDER QUESTION
   ******************************************************/
  function renderQuestion() {
    const q = selectedQuestions[currentIndex];
    scoreAtQuestionStart = userScore;

    // Use formatTextForHTML for the question
    questionTextEl.innerHTML = formatTextForHTML(q.question);

    optionsContainerEl.innerHTML = '';
    feedbackEl.textContent = '';
    feedbackEl.style.display = 'none';
    feedbackEl.className = 'feedback'; // reset classes

    // Single-choice => radio, multiple => checkbox
    const inputType = (q.type === 'single') ? 'radio' : 'checkbox';

    // === RANDOMIZE ANSWERS BY SHUFFLING THE OPTIONS ===
    const shuffledOptions = q.options
      .map((optionText, originalIndex) => ({ 
        text: optionText, 
        index: originalIndex 
      }))
      .sort(() => Math.random() - 0.5);

    // Now loop over the shuffled list to build UI
    shuffledOptions.forEach(({ text, index }) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'option-item';

      const input = document.createElement('input');
      input.type = inputType;
      input.name = 'quizOption_' + currentIndex; // group name
      // IMPORTANT: set the value to the *original* index
      input.value = index; 

      // Use the same function for options so code blocks appear properly
      const label = document.createElement('label');
      label.innerHTML = formatTextForHTML(text);

      wrapper.appendChild(input);
      wrapper.appendChild(label);

      // Az egész sorra kattintva is jelölje be/ki a választ
      // (ha közvetlenül a négyzetre/körre kattintanak, azt a böngésző intézi)
      wrapper.addEventListener('click', (e) => {
        if (e.target !== input) {
          input.click();
        }
      });

      optionsContainerEl.appendChild(wrapper);
    });

    // Update "questions remaining"
    questionsRemainingEl.textContent = (selectedQuestions.length - currentIndex);

    // Haladás mentése (frissítés után innen folytatódik)
    saveProgress();
  }

  /******************************************************
   * 7) CHECK ANSWER
   ******************************************************/
  checkBtn.addEventListener('click', () => {
    const q = selectedQuestions[currentIndex];
    const inputs = [...optionsContainerEl.querySelectorAll('input')];
    
    // Indices that the user checked
    const checkedIndices = inputs
      .filter(inp => inp.checked)
      .map(inp => parseInt(inp.value));

    // Evaluate correctness
    const correctSet = new Set(q.correctAnswers);
    const userSet = new Set(checkedIndices);

    // If user selected any *incorrect* => 0
    let fraction = 0;
    for (let val of userSet) {
      if (!correctSet.has(val)) {
        fraction = 0;
        showFeedback('incorrect', q, fraction);
        userScore += 0;
        return;
      }
    }

    // If user didn't pick anything wrong but missed some correct => partial
    fraction = userSet.size / correctSet.size;
    if (fraction === 1) {
      showFeedback('correct', q, fraction);
    } else if (fraction > 0) {
      showFeedback('partial', q, fraction);
    } else {
      showFeedback('incorrect', q, fraction);
    }
    userScore += fraction;
  });

  /******************************************************
   * 8) SHOW FEEDBACK
   ******************************************************/
  function showFeedback(status, question, fraction) {
    feedbackEl.style.display = 'block';

    // For the "correct answers" portion, we might just show them as text:
    const escapeHTML = (str) =>
      str.replace(/</g, '&lt;').replace(/>/g, '&gt;');

    // Build correct answer string
    const correctAnswersText = question.correctAnswers
      .map(idx => escapeHTML(question.options[idx]))
      .join(', ');

    if (status === 'correct') {
      feedbackEl.classList.add('correct');
      feedbackEl.innerHTML = 'Correct!';
    } else if (status === 'partial') {
      feedbackEl.classList.add('partial');
      const percent = (fraction * 100).toFixed(0);
      feedbackEl.innerHTML = `Partially correct (${percent}%).<br/>
        Correct answers: ${correctAnswersText}`;
    } else {
      feedbackEl.classList.add('incorrect');
      feedbackEl.innerHTML = `Incorrect!<br/>
        Correct answers: ${correctAnswersText}`;
    }

    // Hide check button, show next
    checkBtn.classList.add('hidden');
    nextBtn.classList.remove('hidden');
  }

  /******************************************************
   * 9) NEXT QUESTION
   ******************************************************/
  nextBtn.addEventListener('click', () => {
    currentIndex++;
    if (currentIndex >= selectedQuestions.length) {
      endQuiz();
      return;
    }
    nextBtn.classList.add('hidden');
    checkBtn.classList.remove('hidden');
    renderQuestion();
  });

  /******************************************************
   * 10) END QUIZ
   ******************************************************/
  function endQuiz() {
    clearInterval(timerInterval);
    timerInterval = null;
    clearProgress(); // a befejezett teszt után frissítéskor újraindul
    document.getElementById('quiz-layout').style.display = 'none';

    // Convert userScore to a final percentage
    const finalScore = (userScore / selectedQuestions.length) * 100;
    scorePercentEl.textContent = finalScore.toFixed(2) + '%';
    scoreContainerEl.classList.remove('hidden');
  }

  /******************************************************
   * 11) TIMER
   ******************************************************/
  function updateTimer() {
    if (timeRemaining <= 0) {
      endQuiz();
      return;
    }
    timeRemaining--;
    let minutes = Math.floor(timeRemaining / 60);
    let seconds = timeRemaining % 60;
    if (seconds < 10) seconds = '0' + seconds;
    timerEl.textContent = `${minutes}:${seconds}`;
    saveProgress();
  }

  /******************************************************
   * 12) AUTOMATIKUS MAGASSÁG (beágyazott / iframe használathoz)
   * Az oldal jelzi a szülő oldalnak, mekkora a tartalma,
   * így a beágyazás nem marad nagyobb a kérdés-válasz blokknál.
   ******************************************************/
  function reportHeight() {
    if (window.parent === window) return; // nincs beágyazva
    const height = Math.ceil(Math.max(
      document.body.getBoundingClientRect().height,
      document.body.scrollHeight
    ));
    window.parent.postMessage({ type: 'quiz-height', height: height }, '*');
  }
  if ('ResizeObserver' in window) {
    new ResizeObserver(reportHeight).observe(document.body);
  }
  window.addEventListener('load', reportHeight);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(reportHeight);
  }
  window.addEventListener('resize', reportHeight);

  /******************************************************
   * 13) THEME TOGGLE
   ******************************************************/
  if (themeToggleBtn) {
    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
    });
  }

  </script>
  
</body>
</html>
